- :title: Third Place - 2023 Feature Picture Story
  :credit: Carol Guzy
  :caption: "Misha and Ira go for strolls during frequent blackouts from Russian shelling
    across the country in Truskavets, Ukraine on November 29, 2022.  \r\rTheir daily
    life before war?  Ira is nostalgic for their promenades in Rivne. Now walks consist
    of her pushing a wheelchair and occasionally resting on his lap. They didnt drink
    or go to nightclubs before, preferring quiet moments. They never danced together.
    But Misha chuckles, saying they never really got out of bed.  \r\rThey feel the
    war changed them in some ways for the better with new priorities and a realization
    that the only thing that matters is human life. \r\rFor now, they kiss and cuddle
    and hold onto hope. \r\rIn sickness and in health\r\rGod has plans for me, states
    Misha confidently. I need bionic legs to be able to lift my child off the ground
    in the future.\r"
  :url: "https://photojournalism.s3.amazonaws.com/winners/2023/feature-picture-story/third-place-b87a8e/2023-feature-picture-story-third-place-12-b87a8e.jpg"
