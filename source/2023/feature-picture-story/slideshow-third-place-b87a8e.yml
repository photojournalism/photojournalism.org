- :title: Third Place - 2023 Feature Picture Story
  :credit: Carol Guzy
  :caption: "Misha and Ira embrace during a therapeutic swimming activity at Moldova
    pool in Truskavets, Ukraine on November 16, 2022.   Freed from the confines of
    a wheelchair, they swim together fluidly as one body. Their unflinching romance
    speaks not of life interrupted but rather adapted and embraced. \r\rAt their first
    meeting in person, his jaw was wired shut after being involved in a fight in Odesa.
    If she can accept me with all my scars then she will accept me in every way.  A
    prophesy that proved accurate.  \r\rTheir first kiss?  Marvelous.  Even though
    he had two seams holding his mouth together.\r\rIs she proud of him? Yes\rWhat
    do they like to do? Sex\rFuture plans: Build a house to live.  Make children.
    \ Maybe work with others that lost limbs.  \r\rThey are grateful for every moment
    they spend together. He made it back from the frontline to her arms. With no legs,
    but alive.\r"
  :url: "https://photojournalism.s3.amazonaws.com/winners/2023/feature-picture-story/third-place-b87a8e/2023-feature-picture-story-third-place-9-b87a8e.jpg"
- :title: Third Place - 2023 Feature Picture Story
  :credit: Carol Guzy
  :caption: "Misha plays volleyball with other wounded warriors at a local gym in
    Truskavets, Ukraine on November 10, 2022.\r\rMisha and Ira are not merely existing,
    they are living their lives. They attend volleyball games, weekend mountain trips
    and dinners made more romantic as they tenderly feed each other by the candlelight
    necessary during blackouts from recent shelling.\r\rMisha believes Russian citizens
    are lost sheep. They sit home drinking vodka and listening to propaganda on TV
    and think Russia is best and all others are evil. They live in a barrel of shit
    but believe its a better barrel. "
  :url: "https://photojournalism.s3.amazonaws.com/winners/2023/feature-picture-story/third-place-b87a8e/2023-feature-picture-story-third-place-10-b87a8e.jpg"
