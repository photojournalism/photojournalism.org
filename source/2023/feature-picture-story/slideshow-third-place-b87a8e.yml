- :title: Third Place - 2023 Feature Picture Story
  :credit: Carol Guzy
  :caption: "Sgt. Misha Varvarych, 28, an 80th Assault Brigade commander and his fianc
    Ira Botvynska, 19, awake to a new day at Truskavets City Hospital in western Ukraine
    on November 12, 2022. They navigate an altered destiny after he lost both legs
    fighting during the Russian invasion amid a growing number of war wounded amputees.
    Their unflinching romance speaks not of life interrupted but rather adapted and
    embraced. \r\rIn an age-old adage, love transcends adversity. At a tender age,
    Ira was forced to mature quickly. She plays footsie with his prosthetic leg and
    stands by her man, even when he cant.  I was in love with his legs, especially
    his tattoos, says Ira wistfully.  They said: Face your fear. Accept your war.
    \ \r\rIn a country with a shattered economy, its a challenge for hospitals, also
    under attack and understaffed, to provide adequate care.\r\rMisha displays not
    an ounce of self-pity. His ammunition is humor. When asked his weight and height
    he quips, With or without legs?\r\rHe faces a new profound battle - to walk again.
    \ But freed from the confines of a wheelchair they swim together fluidly as one
    body.\r\rFor all intents and purposes, they feel married after a mutual decision
    to spend their lives together rather than a proposal.  Its a good thing, jokes
    Misha. I cant get down on one knee now.\r\rConversation turns serious when Putins
    name comes up. Misha, the warrior, talks with benevolence. His demure bride says
    she wants to murder the Russian leader.\r\rHe will receive state-of-the-art prosthetics
    in the US.\r\rGod has plans for me, states Misha confidently. I need bionic legs
    to be able to lift my child off the ground in the future.\r"
  :url: "https://photojournalism.s3.amazonaws.com/winners/2023/feature-picture-story/third-place-b87a8e/2023-feature-picture-story-third-place-1-b87a8e.jpg"
- :title: Third Place - 2023 Feature Picture Story
  :credit: Carol Guzy
  :caption: "Mishas prosthetic legs await his new profound battle - to walk again.
    He and Ira begin the daily routine at the hospital where they live in Truskavets,
    Ukraine on November 11, 2022. \r\rI was in love with his legs especially his tattoos,
    says Ira wistfully.  The tattoos above his knees once said: Face your fear. Accept
    your war.   \r\rOn May 29 Misha was on patrol during a combat mission when the
    lethal blast of an anti-personnel mine savagely ripped apart both his legs. The
    grueling evacuation took over four hours and one of his comrades died. He was
    resuscitated three times. Russians shot at the road the entire trek. The tourniquets
    that saved him from bleeding out, also starved his legs which were amputated at
    the hospital. \r\rWith assistance from a fundraiser by Revived Soldiers Ukraine
    nonprofit, they plan travel to the U.S. where he will receive state-of-the-art
    bionic legs.\r"
  :url: "https://photojournalism.s3.amazonaws.com/winners/2023/feature-picture-story/third-place-b87a8e/2023-feature-picture-story-third-place-2-b87a8e.jpg"
- :title: Third Place - 2023 Feature Picture Story
  :credit: Carol Guzy
  :caption: "Ira carries Mishas legs to rehab at their hospital in Truskavets, Ukraine
    on November 11, 2022.  \r\rAt a tender age, Ira was forced to mature quickly,
    offering unconditional love and support to her man. In an age-old adage, love
    indeed transcends adversity.\r\rHe lost track of the number of surgeries he has
    had  18? Maybe 19. As cartilage keeps growing, so will that amount.  But Misha
    treats the amputation as an ordinary disease that can be cured and is temporary.
    \r\rIn a country with a shattered economy, it is a challenge for Ukrainian hospitals,
    also under attack and understaffed, to provide adequate care for the increasing
    demand. There is no concise count of amputees, but the surge is growing daily.\r"
  :url: "https://photojournalism.s3.amazonaws.com/winners/2023/feature-picture-story/third-place-b87a8e/2023-feature-picture-story-third-place-3-b87a8e.jpg"
- :title: Third Place - 2023 Feature Picture Story
  :credit: Carol Guzy
  :caption: "Shrapnel pierced the contents of Mishas pockets when the anti-personnel
    mine exploded and Ira shows his ID card with an eerie hole where his eye should
    be that they keep in a drawer in their room at a hospital in Truskavets, Ukraine
    on November 30, 2022. \r\rIt took both his legs and a fellow soldier, but Misha
    misses the excitement  the life & death adrenaline of war. He felt a purpose fighting
    for his country. He embodies a common refrain with most soldiers - given the choice
    he would return to fight.  Even if he had at least one leg or a knee he insists
    he would definitely go back.  Ira, on the other hand exclaims, No, no, no, no!
    \ I already told him I would break his arms (since he has no more legs to break)
    to not let him go again.  "
  :url: "https://photojournalism.s3.amazonaws.com/winners/2023/feature-picture-story/third-place-b87a8e/2023-feature-picture-story-third-place-4-b87a8e.jpg"
- :title: Third Place - 2023 Feature Picture Story
  :credit: Carol Guzy
  :caption: "An avid bodybuilder, Misha still works out every day at the hospital
    in Truskavets, Ukraine on November 9, 2022. He displays not an ounce of self-pity
    or self-consciousness. His ammunition is humor (at times the self-deprecating
    dark kind popular with military). \r\rWhen asked his weight and height he quips,
    With or without legs? \r\rHe still proudly shows off his physique. We should be
    happy and live with ourselves and not care about anyone elses opinion.  But some
    amputees risk falling into depression and issues of emotional trauma are also
    addressed at the city hospital.\r\rHis jokes are nonstop, but not so funny was
    the chilling premonition he had last year that the war started:  soldiers in his
    battalion died in shelling and he lost his legs. Yet he has no regrets and would
    do it again even knowing the dire outcome.\r"
  :url: "https://photojournalism.s3.amazonaws.com/winners/2023/feature-picture-story/third-place-b87a8e/2023-feature-picture-story-third-place-5-b87a8e.jpg"
- :title: Third Place - 2023 Feature Picture Story
  :credit: Carol Guzy
  :caption: "Nurse Diana Prysiazhna and Ira assist Misha with rehab in Truskavets,
    Ukraine on November 11, 2022. \r\rThey explain how most couples would get on each
    others nerves while living in such a small space for over 6 months, 24/7.  You
    should see us fight.  Like cats and dogs, laughs Misha.  Then Ira clarifies, I
    love everything about him but sometimes I want to choke him. When she is visibly
    angry and distant some days, he has learned to grovel as a good spouse does.  And
    she forgives. \r\rIra accepts a daily routine that is so very different than they
    first imagined. He wanted to be a gym coach, she a manicurist. Im used to it.
    It is what it is, she says. With support you can go through any hell. She never
    for a moment doubted her commitment. Her love is unconditional, but she explains
    it is also hard for her. When you are a caregiver, you also need the words of
    cheering. "
  :url: "https://photojournalism.s3.amazonaws.com/winners/2023/feature-picture-story/third-place-b87a8e/2023-feature-picture-story-third-place-6-b87a8e.jpg"
- :title: Third Place - 2023 Feature Picture Story
  :credit: Carol Guzy
  :caption: "Ira plays footsie with Mishas prosthetic leg during rehab in Truskavets,
    Ukraine on November 14, 2022. \r\rThey transverse obstacles and navigate a new
    terrain in this altered reality while still savoring joy with playful affectionate
    abandon. She wipes his brow, endures his relentless passion for jokes and endlessly
    kisses his lips. She stands by her man, even when he cant.\r"
