- :title: Honorable Mention - 2023 Feature Picture Story
  :credit: Jabin Botsford / The Washington Post
  :caption: "Failure to Thrive\r\rA decade ago, carrying the guilt and grief of her
    mothers death, Tiffany Moore returned to Sedalia, Missouri  her birthplace  to
    set down roots and reconnect with family. Moore, now a 33-year-old single mother,
    recently gave birth to premature twins. She relies on her father, Noble Moore
    Sr., and her friends to get her through each day, especially as she cares for
    one of her twins who has medical complications that require 90-minute treks to
    Kansas City for treatment.\r\rThrough good times and bad, her communitys unwavering
    support gives her the strength and hope she needs to build a better life for her
    children. I would never say this is easy, but I manage. I have no choice [but]
    to do it, Moore said. I cant force their dad to be around. I dont have the ability
    to. They may not have the Buckingham Palace, but they have everything they need.
    And they are happy. The only way I would feel wrong is if they werent happy.\r\r\rTiffany
    Moore, 33, holds her son Raydin Bowens, 11 months, as her father Noble Moore Sr.
    chases Aydin Bowens, 11 months, on Sept. 25, 2023, at Tiffanys home in Sedalia,
    Mo. After she gave birth to her twins, Tiffany had to spend weeks at time with
    doctors in Kansas City, Mo., as they cared for Raydin, who was diagnosed with
    failure to thrive. While she was away from Sedalia, her father stepped in to live
    with and care for Aydin. "
  :url: "https://photojournalism.s3.amazonaws.com/winners/2023/feature-picture-story/honorable-mention-3eb16f/2023-feature-picture-story-honorable-mention-1-3eb16f.jpg"
