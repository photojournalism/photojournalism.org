- :title: Honorable Mention - 2023 Feature Picture Story
  :credit: Carol Guzy
  :caption: "CleShai Perry, 18 was at the backyard playground of her building in the
    Shaw neighborhood and caught in the crossfire of a barrage of bullets by multiple
    gunmen that cut her life short, with bullet holes on cars evident nearby in Washington
    DC on September 5, 2023.  Mikeya Ferguson, 19 also perished and her 15-year-old
    cousin was seriously injured.  Her father has called for the National Guard to
    be deployed to stem the rash of violence in the city.  \r\rToo often it is young
    people doing the shooting - and doing the dying.  In record numbers. Historically
    underserved communities and racial inequities contribute to a culture of gun violence
    with a disproportionate number of African Americans dead or incarcerated.  \r\rAccording
    to the Gun Violence Archive, to date the total number of deaths by guns is 33,
    886. Teens killed 1,130 and 3,166 injured.  Homicides in the nations capital surpassed
    200 recently, up 35% from last year. As policy-makers debate gun control especially
    concerning assault weapons  the body count increases with innocents caught in
    the crossfire.\r"
  :url: "https://photojournalism.s3.amazonaws.com/winners/2023/feature-picture-story/honorable-mention-f29936/2023-feature-picture-story-honorable-mention-1-f29936.jpg"
- :title: Honorable Mention - 2023 Feature Picture Story
