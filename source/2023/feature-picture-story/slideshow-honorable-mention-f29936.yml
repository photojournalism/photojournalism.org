- :title: Honorable Mention - 2023 Feature Picture Story
  :credit: Carol Guzy
  :caption: "Loved ones attend the repast of CleShai Perry, 18 years old at Epiphany
    Cemetery in Forestville, MD on September 22, 2023. \r\rThere has emerged a subculture
    for final farewells.  Rituals include RIP T-shirts, lantern releases, elaborate
    decorations, and a life-size cutout of the departed where loved ones pose for
    selfies. Other bereaved mothers chat about their own losses and show cellphone
    images of coffin portraits, their last memory.  Seems everywhere there is someone
    who knows someone affected by gun violence.\r\rFunerals are filled with tears
    and echoes of mourning.  But the repast is also a time for a passionate celebration
    of life. "
  :url: "https://photojournalism.s3.amazonaws.com/winners/2023/feature-picture-story/honorable-mention-f29936/2023-feature-picture-story-honorable-mention-10-f29936.jpg"
