    DC on September 8, 2023. She loved pink and her family and friends showered her
    vigil and services in pastel and vivid hues of her favorite color, dressing in
    pink finery with elaborate decorations.  \r\rFrom the funeral program: Shai was
    very outgoing and strong-minded, just like her mother, whom she adored.  Her mother
    was her role model, twin, and best friend.  As Shai grew older, the more she resembled
    her mother and adopted her style, so much so that she would get in trouble for
    wearing her mothers clothes and shoes. "
