  :caption: "CleShai Perry, 18 years old looked like a beautiful angel in the casket,
    wrapped in a sophisticated pink suit during her funeral at the Temple of Praise
    in Washington DC on September 22, 2023. She was caught in the crossfire when a
    hail of bullets cut her life short.  Another young person lies with mortal stillness
