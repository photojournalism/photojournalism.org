- :title: Second Place - 2023 Domestic (US) General News Picture Story
  :credit: Rick Bowmer / Associated Press
  :caption: 'A group of volunteers who sailed from Maalaea Bay, Maui, form an assembly
    line on Kaanapali Beach on Aug. 12, 2023, to unload donations from a boat. When
    the most deadly U.S. fire in a century ripped across the Hawaiian island, it damaged
    hundreds of drinking water pipes, resulting in a loss of pressure that likely
    allowed toxic chemicals along with metals and bacteria into water lines. Experts
    are using strong language to warn Maui residents in Lahaina and Upper Kula not
    to filter their own tap water. '
  :url: "https://photojournalism.s3.amazonaws.com/winners/2023/domestic-(us)-general-news-picture-story/second-place-6c4a07/2023-domestic-(us)-general-news-picture-story-second-place-8-6c4a07.jpg"
