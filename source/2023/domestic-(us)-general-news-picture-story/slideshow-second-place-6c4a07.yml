- :title: Second Place - 2023 Domestic (US) General News Picture Story
  :credit: Rick Bowmer / Associated Press
  :caption: "In early August 2023, a series of wildfires, referred to as the Hawaii
    Firestorm by the United States government, broke out in the U.S. state of Hawaii,
    predominantly on the island of Maui. The wind-driven fires prompted evacuations,
    caused widespread damage, killing at least 97 people and leaving at least 31 persons
    missing.\r\rWildfire wreckage is seen Thursday, Aug. 10, 2023, in Lahaina, Hawaii. "
  :url: "https://photojournalism.s3.amazonaws.com/winners/2023/domestic-(us)-general-news-picture-story/second-place-6c4a07/2023-domestic-(us)-general-news-picture-story-second-place-1-6c4a07.jpg"
