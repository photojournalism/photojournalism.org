- :title: Honorable Mention - 2023 Domestic (US) General News Picture Story
  :credit: George Walker IV / Associated Press
  :caption: "In August 2023, Tennessee lawmakers abruptly ended a special session
    initially touted to improve public safety in the wake of the deadly mass shooting
    that took place at The Covenant School in Nashville, but it quickly unraveled
    into chaos over the course of a week as the GOP-dominant Statehouse refused to
    take up gun control measures and instead spent most of the time ensnared in political
    infighting.\r\rParents from The Covenant School comfort each other and hold signs
    above the House floor advocating for gun law reform during a special session of
    the state legislature on public safety Monday, Aug. 28, 2023, in Nashville, Tenn. "
