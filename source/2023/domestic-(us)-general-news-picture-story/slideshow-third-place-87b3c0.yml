- :title: Third Place - 2023 Domestic (US) General News Picture Story
  :credit: Brian Snyder / Reuters
  :caption: "Xiomara Merchan and her mother Tatiana, migrants from Ecuador, embrace
    emotionally after crossing the Rio Grande into the United States 6 weeks after
    leaving their home country, in Eagle Pass, Texas, September 27, 2023.   \r\rSTORY
    SUMMARY: After a journey of weeks, months and even a year to get there, migrants
    wade across the Rio Grande near a railroad bridge in Eagle Pass, Texas, only to
    face coils of sharp razor wire laid along the banks.  Eventually Border Patrol
    agents cut an opening in the razor wire allowing the migrants to be taken into
    custody, and immediately after members of the Texas National Guard close the opening
    with more razor wire, as the physical barriers put up by Texas, coupled with the
    Biden administration message that crossing illegally could have tougher immigration
    consequences, seemed to do little to deter the hundreds of migrants crossing from
    the Mexican border city of Piedras Negras. US Customs and Border Protections fiscal
    year 2023 came to a close with a new record of 2,475,898 encounters, surpassing
    the previous record from 2022. "
