  :caption: "Wind fueled wildfires in August devastated communities in Maui. One in
    Kula A destroyed countless structures and caused environmental ramifications.
    A later wildfire killed nearly 100 people and destroyed the historic town of Lahaina.
    Neighboring towns throughout the Hawaiian Islands and beyond rallied to the people
    who were displaced and those who were grieving.\r\rMark Ross works on cutting
    burnt fence on his property that was destroyed by last weeks fire on Wednesday
    August 16, 2023 in Kula, HI. The chimney is all they is visible from a house that
    he used to live in and was being rented out to another family. "
