- :title: Honorable Mention - 2023 Sports Picture Story
  :credit: Sascha Fromm / Thueringer Allgemeine
  :caption: "BALL RETRIEVER\rThis is a series of pictures taken during football matches
    in the eighth, ninth and tenth football leagues. In these local soccer games,
    there are no ball retrievers like there are in the top leagues. The players have
    to retrieve the game balls themselves, often from fields, gardens, small rivers
    or roads.\rThese little league games are often just played in front of not more
    than 10 to 50 spectators at the sidelines.\rFootball is by far the most popular
    sport in Germany. More than 80 000 soccer games will played every weekend and
    approximately 50,000 referees whistle the matches. Seven million people are members
    of one of over 24,000 football clubs. \r\r\r\rIn this photo: \rChristian Witaseck
    #18 of Isserstedt picks up the ball from behind an old bus stop, that has been
    converted into a spectator stand, during the 9th soccer league match between SV
    Klengel-Serba 09 I and SG Union Isserstedt on October 22, 2022 at sportsplace
    in Serba, Germany. "
  :url: "https://photojournalism.s3.amazonaws.com/winners/2023/sports-picture-story/honorable-mention-37aac5/2023-sports-picture-story-honorable-mention-1-37aac5.jpg"
