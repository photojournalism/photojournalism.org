- :title: Honorable Mention - 2023 Sports Picture Story
  :credit: Ebrahim Noroozi / Associated Press
  :caption: "Afghanistans ruling Taliban have banned women from sports as well as
    barring them from most schooling and many realms of work. A number of women posed
    for the photographer for portraits with the equipment of the sports they loved.
    Though they do not necessarily wear the burqa in regular life, they chose to hide
    their identities with their burqas because they fear Taliban reprisals and because
    some of them continue to practice their sports in secret. \r\rAn Afghan women's
    soccer team poses for a photo in Kabul, Afghanistan, Thursday, Sept. 22, 2022. "
