- :title: First Place - 2023 Sports Picture Story
  :credit: Scott Strazzante / San Francisco Chronicle
  :caption: "Fighting for a Family\r\rMichael Portales spent his childhood in and
    out of the foster care system. At the age of 13, while homeless, Portales met
    Gilbert Juarez and his life would change. Juarez invited the teen to stay with
    his family at their Northern California home and for the first time, Portales
    had a stable home environment. Over the next ten years, Portales struggled and
    spent 3 stints in jail, but his new family stood by his side. Finally, in 2020,
    Portales committed himself to get in shape and stay on the right side of the law.
    In the backyard of his adoptive fathers home, Portales started training as a boxer
    under the moniker Mikey the Bull and helped recruit other troubled area teens
    to form Bullgang Boxing. Now 27, Portales has fought five professional fights
    including one at the T-Mobile Arena in Las Vegas.\r\r\rMichael Mikey the Bull
    Portales rides to his boxing match at Emerald Queen Casino in Tacoma, Washington,
    on Friday, April 7, 2023."
