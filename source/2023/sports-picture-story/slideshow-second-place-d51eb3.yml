- :title: Second Place - 2023 Sports Picture Story
  :credit: Mathieu Belanger
  :caption: "Ukraine Team Select arrives at the Montreal International airport in
    Montreal, February 2, 2023.\r\rIn February of 2023, a team of 11 and 12 years
    old Ukrainians came to Canada to compete in an international hockey tournament.
    Before the beginning of the competition, the team had three weeks to practice.
    The coach picked players from all over Europe, some fled the war to neighbour
    countries and some were still living Ukraine. Their journey ended after winning
    their first two games, loosing to the eventual winner of the tournament. "
