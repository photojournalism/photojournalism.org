  :caption: "STORY: In February 2022, Kendall Staton wrote her first article as a
    junior at the University of Kentucky. Originally a class assignment, she published
    the piece about civic involvement in the student newspaper. After that, she applied
    for a full-time reporting position at a local newspaper, despite still being a
    full-time student with multiple jobs and little experience. When the hiring manager
    for the position called, Kendall shared a schedule she had mapped out to handle
    all the responsibilities. She didnt get the job, but she began freelancing for
    a newspaper in the same company. \r\rWhen she graduated in May 2023 at 19 years
    old, she was offered the editor-in-chief position at the Cynthiana Democrat by
    the same hiring manager. She took over the position from Becky Barnes, who had
    worked for the paper for 47 years. She oversees an editorial staff of her and
    Lee Kendall, a sports writer who was once a history teacher. Staton hopes to work
    at a big paper one day, but she is embracing the current challenge of steering
    a local paper into the future.\r\rWhats happening down the street is just as important
    as what is happening in New York, Staton said. Stuff happening down the street,
    we are going to be there. And we are the only people going to be there. If we
    dont cover it, no one else will.\"\r\r\r\r\rCaption: Journalist Kendall Staton
    covers the first day of school at Southside Elementary School on Thursday, August
