- :title: 2023 Rich Mahan Best Student Portfolio
  :credit: Lukas Flippo / Yale University
  :caption: "STORY:\rAntonios on the phone with his wife on the couch, laughing as
    she shows him pictures of a field of sunflowers back home. Juan is cooking chicken,
    vegetables, and tomatoes for tacos. \r\rIts lunchtime for Antonio Gonzales, Juan
    Gonzales, and Pedro Martinez, migrant farm workers who live in a bunkhouse on
    the Yazel farm in Berry, Kentucky. The house is vanguard to acres of tobacco.
    Inside, there is a kitchen with a dining table, a couch, and a pool table. Signs
    are posted on walls reading their rights and the rules their employers must abide
    by, as well as the responsibilities they have during their work here. Next, a
    bathroom with a toilet, sink, and shower.  And one bedroom, where they each get
    their own piece partitioned off by curtains. Inside each curtain is a mini-bedroom:
    a bunk bed, a dresser.  A fan on high points toward Antonios bed, a wooden chair
    covered in a towel holds his medications. \r\rLunchtime is when Antonio, Pedro,
    and Juan speak with their families. While one person cooks, the other two retreat
    to WhatsApp video calls and text chats. Today, Antonio takes the couch, Pedro
    wanders outside to the barn, laying down and calling home while staring at the
    tobacco overhead.\r\rTomorrow, Antonio cooks, Juan tells me as he shakes the vegetables
    on the pan, a piece flying out and landing on the white bandaging that stabilizes
    his wrist. Each of them work for their family back home -  their minimum wage
    of $15 for 7 months supports their loved ones back in Mexico. \r\r\rCaption:\rRoberto
    Trinidad sorts tobacco Wednesday, June 21, 2023, at Clifford Farms in Sunrise,
    KY. Trinidad is a seasonal farm worker, living in the United States for the majority
    of the year working on tobacco farms in Kentucky."
  :url: "https://photojournalism.s3.amazonaws.com/winners/2023/rich-mahan-best-student-portfolio/first-place-271735/2023-rich-mahan-best-student-portfolio-first-place-11-271735.jpg"
