  :caption: "The 2022 World Cup marks the first major world sporting event to be held
    in the Middle East, and, specifically, religiously devout Qatar. Days before the
    opening ceremonies the country banned alcohol in stadiums - usually strictly policed
    in the region, but a quintessential part of the experience for most fans. The
    event, an investment of roughly $300 billion dollars for the country, brought
    just over 1.4 million people to watch. And fans got the drama they came for. Qatar
    lost their own opening game, and massive upset wins from Saudi Arabia, Japan and
    Morocco. Star player, Lionel Messi, won in the last World Cup match of his career
    for Argentina against France. \r\rDOHA, QATAR - NOVEMBER 23: Visitors and locals
