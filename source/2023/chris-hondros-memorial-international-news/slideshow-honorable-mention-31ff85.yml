- :title: Honorable Mention - 2023 Chris Hondros Memorial International News
  :credit: Ariana Cubillos / Associated Press
  :caption: "In Haiti, more than 2,400 people have been reported killed from January
    through mid-August this year, with more than 950 kidnapped and another 902 wounded,
    according to U.N. statistics. Violence against women and children in particular
    has risen. More than 200,000 Haitians have lost their homes to gangs who set fire
    to communities and rape and kill residents in a bid to wrestle territory from
    rival gangs. Two U.N. agencies have warned of rising food emergencies including
    starvation in Haiti due to restricted movements of people and goods. \r\rA no
    firearms allowed sign hangs on a fence at an emergency room run by Doctors Without
    Borders in the Cite Soleil district of Port-au-Prince, Haiti, Wednesday, May 31,
    2023. The international medical humanitarian organization had temporarily suspended
    activities due to the escalating violence in the Haitian capital.   "
