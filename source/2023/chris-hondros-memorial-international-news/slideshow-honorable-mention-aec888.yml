  :credit: Laurent Cipriani / Associated Press
  :caption: "French President Emmanuel Macron has shunned parliament and imposed a
    highly unpopular change to the nation's pension system, raising the retirement
    age from 62 to 64. French unions held mass demonstrations since Macron enflamed
    public anger by forcing a higher retirement age through parliament without a vote.
    This series chronicles the public protests and discontent over the new rule.\r\rProtesters
    clash with police officers during a demonstration in Lyon, central France, Thursday,
    March 23, 2023. French unions are holding their first mass demonstrations Thursday
    since President Emmanuel Macron enflamed public anger by forcing a higher retirement
    age through parliament without a vote."
