- :title: Third Place - 2022 Ukraine War Picture Story
  :credit: Santi Palacios
  :caption: "The city of Bucha, next to Kyiv, will go down in history as one of the
    symbols of the atrocities perpetrated by Russian forces in the war against Ukraine.
    As the days go by after the withdrawal of Russian soldiers from the city, details
    of the executions, murders and abuses that took place during a month of occupation
    are emerging.\r\rThis photo essay collects the sensations and images of the occuopation
    after the withdrawal of the Russian troops and  during the days that followed:
    the stories of those who lived under the occupation reconstruct a scene of war
    crimes.\r\rIn the image: The city of Bucha as seen from a nine-story building
    on Yablunska street, where most of the bodies were found. It was one of the many
    buildings occupied by Russian soldiers. From this window they controlled the civilian
    population."
  :url: "https://photojournalism.s3.amazonaws.com/winners/2022/ukraine-war-picture-story/third-place-ed781d/2022-ukraine-war-picture-story-third-place-1-ed781d.jpg"
- :title: Third Place - 2022 Ukraine War Picture Story
  :credit: Santi Palacios
  :caption: The liveless bodies of more than a dozen people lie on the road and sidewalk
    of Yablunska Street, in Bucha, April 2, 2022. Some of them were handcuffed, others
    had white armbands and most were apparently shot to death.
  :url: "https://photojournalism.s3.amazonaws.com/winners/2022/ukraine-war-picture-story/third-place-ed781d/2022-ukraine-war-picture-story-third-place-2-ed781d.jpg"
