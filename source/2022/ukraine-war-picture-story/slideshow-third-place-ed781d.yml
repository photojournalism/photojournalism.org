  :credit: Santi Palacios
  :caption: The bodies collected from the streets and houses of Bucha were transferred
    to Cemetery number 3, were they were registered before being transferred to different
    morgues to perform an autopsy and try to identify them, on April 12, 2022.
  :url: "https://photojournalism.s3.amazonaws.com/winners/2022/ukraine-war-picture-story/third-place-ed781d/2022-ukraine-war-picture-story-third-place-11-ed781d.jpg"
- :title: Third Place - 2022 Ukraine War Picture Story
  :credit: Santi Palacios
  :caption: "On April 7, we went to a nursing home where there were six dead elderly
    people. Four of the bodies were found next to an indoor swimming pool in the garden
    of the residence, which was a chalet away from the center of Bucha. The body of
    a fifth person was in the garden, and that of a sixth old man was on the bed in
    one of the rooms.\r\rOne of the bodies in that residence was that of Valentina,
    82 years old. On April 12, I met her son, Anatoliy, who was at the old woman's
    funeral, at the cemetery. He said that at all times the workers of the residence
    tried to take care of the elderly. But due to the lack of electricity, water,
    gas and medicines, and taking into account the precarious health of these people,
    they gradually died. They died as a result of the war. In the absence of everything."
  :url: "https://photojournalism.s3.amazonaws.com/winners/2022/ukraine-war-picture-story/third-place-ed781d/2022-ukraine-war-picture-story-third-place-12-ed781d.jpg"
