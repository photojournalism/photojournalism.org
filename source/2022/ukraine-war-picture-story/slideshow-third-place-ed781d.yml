- :title: Third Place - 2022 Ukraine War Picture Story
  :credit: Santi Palacios
  :caption: "Valeriy  along with his son Andriy, other relatives and friends, and
    police officers  digged up the coffin with the body of his eldest son, Oleksiy,
    who was shot dead in the center of Bucha on March 12. \rOleksiy didn't return
    home after visiting someone who was going to be evacuated. His father and borther
    couldn't go beyond the surroundings of the house to search for him due to the
    presence of Russian troops.\rIt was the next day when Valeriy himself found the
    body of his son in a street in the center of the city. After giving him a temporary
    burial in the garden, on April 8 he had to dig him up again to be transferred
    to a morgue for an autopsy, before being cremated."
  :url: "https://photojournalism.s3.amazonaws.com/winners/2022/ukraine-war-picture-story/third-place-ed781d/2022-ukraine-war-picture-story-third-place-10-ed781d.jpg"
