- :title: Second Place - 2022 Ukraine War Picture Story
  :credit: Evginey Maloletka / Associated Press
  :caption: "The siege of Mariupol was a military action in Ukraine during the 2022
    Russian invasion of Ukraine, when forces from Russia and the separatist Donetsk
    People's Republic engaged Ukrainian forces in the city of Mariupol. The battle,
    which was part of the Russian Eastern Ukraine offensive, started on 24 February
    2022 and concluded on 20 May 2022, when Russia announced the remaining Ukrainian
    forces in Mariupol surrendered after they were ordered to cease fighting. \rMariupol
    is located in Donetsk Oblast, Ukraine, and is claimed by the Russian-backed separatist
    Donetsk People's Republic. Russian forces completely besieged the city on 2 March,
    after which they gradually gained control of the city. By 22 April, the remaining
    Ukrainian forces had retreated to the Azovstal Iron and Steel Works, a massive
    and highly defensible industrial complex. \rThe Red Cross described the situation
    as \"apocalyptic\", and Ukrainian authorities have accused Russia of engineering
    a major humanitarian crisis in the city, with city officials reporting that about
    21,000 civilians have been killed. Ukrainian officials also reported that at least
    95% of the city has been destroyed during the fighting, largely by Russian bombardments.
    \rThe siege ended on 16 May 2022, after what media outlets variously called the
    \"evacuation\" or \"surrender\" of the remaining Ukrainian personnel from the
    Azovstal Iron and Steel Works; the Russian Ministry of Defense stated that the
    Ukrainians had \"surrendered\", a word Ukraine avoided using. \r\r\rAn apartment
    building explodes after a Russian army tank fires in Mariupol, Ukraine, Friday,
    March 11, 2022. "
  :url: "https://photojournalism.s3.amazonaws.com/winners/2022/ukraine-war-picture-story/second-place-7019ad/2022-ukraine-war-picture-story-second-place-1-7019ad.jpg"
