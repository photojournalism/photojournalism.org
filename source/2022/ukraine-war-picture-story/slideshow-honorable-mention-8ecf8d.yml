- :title: Honorable Mention - 2022 Ukraine War Picture Story
  :credit: Francisco Seco / Associated Press
  :caption: "This series chronicles the ongoing war in Ukraine and its toll on the
    Ukrainian people. On February 24, 2022, Russia invaded Ukraine in a major escalation
    of the Russo-Ukrainian War. The invasion has likely resulted in tens of thousands
    of deaths on both sides and caused Europe's largest refugee crisis since World
    War II, with an estimated 8 million people being displaced within the country
    by late May as well as 7.6 million Ukrainians fleeing the country as of October
    2022. The invasion has also caused global food shortages. \r\rSmoke rises after
    big explosions in Kharkiv, Ukraine, early Saturday, Oct. 8, 2022. "
