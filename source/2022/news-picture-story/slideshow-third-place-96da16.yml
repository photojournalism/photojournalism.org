- :title: Third Place - 2022 News Picture Story
  :credit: Al Drago
  :caption: "SUMMARY: Everyone wants a piece of Joe Manchin. As the Democratic Senator
    from West Virginia, Manchin has consistently held up the Biden agenda and been
    the deciding vote on legislation, while the Democrats hold a 50-50 majority in
    a largely partisan Senate. \r\rCAPTION: Senator Joe Manchin, a Democrat from West
    Virginia, arrives during a news conference about a bill to ban Russian energy
    imports, at the U.S. Capitol in Washington, D.C., U.S., on Thursday, March 3,
    2022. The White House is asking Congress for $32.5 billion in emergency funding
    to boost its response to Russia's invasion of Ukraine and tackle the ongoing fight
    against the coronavirus. "
  :url: "https://photojournalism.s3.amazonaws.com/winners/2022/news-picture-story/third-place-96da16/2022-news-picture-story-third-place-1-96da16.jpg"
- :title: Third Place - 2022 News Picture Story
  :credit: Al Drago
  :caption: Senator Joe Manchin, a Democrat from West Virginia, bottom center, stands
    and applauds while listening during a State of the Union address by U.S. President
    Joe Biden at the U.S. Capitol in Washington, D.C., U.S., on Tuesday, March 1,
    2022. Biden's first State of the Union address comes against the backdrop of Russia's
    invasion of Ukraine and the subsequent sanctions placed on Russia by the U.S.
    and its allies.
