- :title: Honorable Mention - 2022 News Picture Story
  :credit: Jessica Phelps / Newark Advocate
  :caption: "Tenants at the Seven Oaks Apartments, located on San Antonios West side
    (now renamed Colinas at Medical) have lived with mold caused by leaky roofs and
    plumbing, rats, cockroaches, nonfunctional laundry facilities billing problems
    and crime. Many tenants did not have working air-conditioning during a summer
    where temperatures were consistently in the triple digits.They said problems went
    unaddressed or got Band-Aid fixes only to reoccur soon after. With the help of
    Texas Organizing Project (TOP), tenants banded together to form a tenants union
    and demand changes together. They organized protests in Austin at the offices
    of the property owners offices, got the attention of city council to talk about
    changing laws in the city, all while continuing to live in deplorable conditions.
    \r\rTwonya Mondy (right) embraces her friend and neighbor, ZhiRia Cook after her
    apartment flooded July 24. Cook lost most of her belongings including her bed.
    Cook had complained to Seven Oaks management for months about leaks in the apartment
    but nothing was ever fixed properly. Both are residents at Seven Oaks and both
    have had many problems with their apartments that have not been fixed. "
  :url: "https://photojournalism.s3.amazonaws.com/winners/2022/news-picture-story/honorable-mention-cf3166/2022-news-picture-story-honorable-mention-1-cf3166.jpg"
- :title: Honorable Mention - 2022 News Picture Story
  :credit: Jessica Phelps / Newark Advocate
  :caption: "Amanda Williams folds laundry while her daughter, Charlotte, plays in
    moving boxes in June. Williams and her husband Kaleob Williams have been slowly
    packing their belongings after receiving a letter to vacate from the property
    management of Seven Oaks. Many of the tenants of Seven Oaks received the same
    letter to vacate in an effort by property owner, James Kandisamy to change the
    demographic of the property. \rThe Williams have had many problems since moving
    into the apartment complex, including mold so bad it was making their special
    needs children sick. After their  nurses intervened they were able to get the
    carpet in the childrens room changed. They continue to live in limbo, half of
    their belongings packed in boxes in case they get an official eviction notice. "
  :url: "https://photojournalism.s3.amazonaws.com/winners/2022/news-picture-story/honorable-mention-cf3166/2022-news-picture-story-honorable-mention-2-cf3166.jpg"
- :title: Honorable Mention - 2022 News Picture Story
  :credit: Jessica Phelps / Newark Advocate
  :caption: 'Frustrated and hot, Debra Watts wipes sweat from her face after another
    disappointing call looking for a new apartment July 7. Most apartments with openings
    do not accept housing vouchers, which Watts relies on. Wattss air conditioning
    hasnt worked in weeks and as temperatures stay in the triple digits she worries
    about her underlying health conditions and the wellbeing of her dog, Baby.  Watts
    lives in the Seven Oaks apartment complex and like most residents in the complex,
    she has received a notice to vacate. Watts has become an active member of the
    tenants union she and other residents started with the help of Texas Organizing
    Project. '
  :url: "https://photojournalism.s3.amazonaws.com/winners/2022/news-picture-story/honorable-mention-cf3166/2022-news-picture-story-honorable-mention-3-cf3166.jpg"
- :title: Honorable Mention - 2022 News Picture Story
  :credit: Jessica Phelps / Newark Advocate
  :caption: 'Seven Oaks resident, Claudia Nega, speaks with the San Antonio Police
    Department after calling them to issue a complaint on the apartments complexs
    maintenance worker on July 20. Nega alleges that he became aggressive and she
    felt threatened when he came to check on her air conditioning unit. Nega says
    she had to turn it off because it was not fixed correctly and was causing her
    breaker to switch off an on and she was afraid a fire would start or her refrigerator
    holding her insulin would break. Nega and other residents have had trouble getting
    work orders on their apartments filled by the management office and formed a tenants
    union so they could face off against the property owners as a collective. '
  :url: "https://photojournalism.s3.amazonaws.com/winners/2022/news-picture-story/honorable-mention-cf3166/2022-news-picture-story-honorable-mention-4-cf3166.jpg"
- :title: Honorable Mention - 2022 News Picture Story
  :credit: Jessica Phelps / Newark Advocate
  :caption: ZhiRia Cook, 23, stands in the middle of her Seven Oaks bedroom as water
    pours out of every fixture flooding her entire apartment on July 24. Cook had
    been complaining to the management office for months about water leaks throughout
    her apartment but nothing was ever fixed. Cook salvaged what she could, but most
    of her belongings were ruined by the water including the bed she had saved to
    buy and toys belonging to her young son. This apartment was Cooks first time she
    was able to live alone and support herself. Her son was not living with her at
    the time of the flooding because she felt the roach infestation and mold were
    too dangerous for a 3 year old.
  :url: "https://photojournalism.s3.amazonaws.com/winners/2022/news-picture-story/honorable-mention-cf3166/2022-news-picture-story-honorable-mention-5-cf3166.jpg"
- :title: Honorable Mention - 2022 News Picture Story
  :credit: Jessica Phelps / Newark Advocate
  :caption: 'Reynaldo Florida Barrientos holds his friends grandson, Aprii, while
    his son, Deeandree tries to get his attention in July. Barrientos and his friend,
    Twonya Mondy (not pictured) both live in Seven Oaks and neither one has had working
    air conditioning for weeks. To try and compensate Mondy has hung black curtains
    over her windows and has multiple fans going at all times. As temperatures reach
    triple digits daily these measures do little to quell the heat and Barrientos,
    Mondy and other Seven Oaks tenants are left sweltering in their apartments. '
  :url: "https://photojournalism.s3.amazonaws.com/winners/2022/news-picture-story/honorable-mention-cf3166/2022-news-picture-story-honorable-mention-6-cf3166.jpg"
- :title: Honorable Mention - 2022 News Picture Story
  :credit: Jessica Phelps / Newark Advocate
  :caption: 'Ernestina Martinez sits in her walker outside her Seven Oaks apartment
    looking at her belongings on August 15. Martinez had just returned from a month
    long stay at a nearby Motel 6 to find her apartment overflowing with water from
    a leaking pipe that had slowly been getting worse. Unable to put her stuff inside
    Martinez sat in the heat waiting to hear if an how the office management would
    help her. They did agree to move her into a new apartment, but the first one they
    offered her was on a second floor, which she was unable to accept because she
    could not climb the stairs. Martinez had stayed at the Motel 6 because the air-conditioning
    in her apartment was not working and was never fixed by on site maintenance. '
  :url: "https://photojournalism.s3.amazonaws.com/winners/2022/news-picture-story/honorable-mention-cf3166/2022-news-picture-story-honorable-mention-7-cf3166.jpg"
- :title: Honorable Mention - 2022 News Picture Story
  :credit: Jessica Phelps / Newark Advocate
  :caption: 'Twonya Mondy, a resident of Seven Oaks, writes Where are you when we
    need you? on a giant poster of San Antonio Mayor Ron Nirenberg. The tenants had
    invited Mayor Ron Nirenberg to their weekly tenants union meeting to discuss their
    poor living conditions, but he did not attend. Seven Oaks tenants and organizers
    from Texas Organizing Project have been reaching out to city officials including
    the mayor to try and force the property owners of the apartment complex to improve
    living conditions for residents. '
  :url: "https://photojournalism.s3.amazonaws.com/winners/2022/news-picture-story/honorable-mention-cf3166/2022-news-picture-story-honorable-mention-8-cf3166.jpg"
- :title: Honorable Mention - 2022 News Picture Story
  :credit: Jessica Phelps / Newark Advocate
  :caption: "Ernestina Martinez argues with an employee of Achieve Investments as
    she and other Seven Oaks tenants and organizers from Texas Organizing Project
    descended on Achieve Properties offices in Austin on August 1. They were there
    to protest the way they have been treated by the property owners and management
    company. Among their list of demands was money to help them relocate, erasing
    the mass of evictions from their records and fixing the properties to make them
    livable in the meantime. Property owner James Kandasamy (not pictured) finally
    agreed to meet with tenants one on one or in a small group, but the tenants, at
    the encouragement of TOP, refused, saying they would meet as a group or not at
    all. \r"
  :url: "https://photojournalism.s3.amazonaws.com/winners/2022/news-picture-story/honorable-mention-cf3166/2022-news-picture-story-honorable-mention-9-cf3166.jpg"
- :title: Honorable Mention - 2022 News Picture Story
  :credit: Jessica Phelps / Newark Advocate
  :caption: 'Kaleob Williams leans his head against his childrens bunk bed while trying
    to change the TV channel on July 7. Williams and his wife have had many problems
    since moving in to the unit at Seven Oaks, including mold so bad it was making
    their special needs children sick. After their nurses intervened they were able
    to get the carpet in the childrens room changed. There is so much gunfire in the
    apartment complex Williams wont let his children sleep on the top bunk because
    it is next to the window. They are also dealing with air-conditioning that sporadically  works,
    a roach infestation and leaky pipes. '
