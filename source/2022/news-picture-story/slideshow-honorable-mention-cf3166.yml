- :title: Honorable Mention - 2022 News Picture Story
  :credit: Jessica Phelps / Newark Advocate
  :caption: Jaqueline Gutierrez sits in the San Antonio Precinct 2 Justice of the
    Peace courtroom after loosing an eviction judgement on her Seven Oaks apartment
    on August 23. Gutierrezs apartment hasnt had working air conditioning for months,
    her ceiling in her living room leaks whenever it rains and her bathroom has a
    continuous leak that has never been fixed. San Antonio Housing Authority (SAHA)
    failed her apartment in May and stopped paying her rent. The property owners never
    fixed the problems, and Gutierrez was unable to keep up with the rent without
    the SAHA voucher. Gutierrez, like other tenants at Seven Oaks, had been looking
    hard for a new place to live, but was having trouble finding a place for her and
    her daughter that accepted housing vouchers.
  :url: "https://photojournalism.s3.amazonaws.com/winners/2022/news-picture-story/honorable-mention-cf3166/2022-news-picture-story-honorable-mention-11-cf3166.jpg"
- :title: Honorable Mention - 2022 News Picture Story
  :credit: Jessica Phelps / Newark Advocate
  :caption: 'ZhiRia Cook sits in her doorway, visibly shutting down after watching
    her apartment flood, ruining her belongings. The flooding started early Sunday
    morning, July, 24. Cook was making coffee when she heard water coming through
    a light fixture. The sound increased until it sounded like it was raining inside
    her apartment and water was coming through every light fixture and outlet. Cook
    had been complaining to the Seven Oaks management office for months about water
    leaks throughout her apartment but nothing was ever fixed. Cook salvaged what
    she could, but most of her belongings were ruined by the water including the bed
    she had saved for months to buy. '
