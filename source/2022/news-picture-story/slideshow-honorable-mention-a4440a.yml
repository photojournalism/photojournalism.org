- :title: Honorable Mention - 2022 News Picture Story
  :credit: Al Drago
  :caption: "SUMMARY: Ketanji Brown Jackson made history in 2022 when she became the
    first African-American woman confirmed to the U.S. Supreme Court.\r\rCAPTION:
    Ketanji Brown Jackson, nominee for associate justice of the U.S. Supreme Court,
    speaks during an announcement ceremony with U.S. President Joe Biden at the White
    House in Washington, D.C., U.S., on Friday, Feb. 25, 2022. Jackson, 51, would
    be the first Black woman on the Supreme Court if confirmed and is a federal appeals
    court judge who once served as a public defender, a job no justice has ever held. "
