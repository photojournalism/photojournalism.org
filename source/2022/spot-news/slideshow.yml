  :credit: Gene J. Puskar / Associated Press
  :caption: 'In this aerial image taken with a drone, vehicles rest on a bridge following
    its collapse, Friday Jan. 28, 2022, in Pittsburgh. The bridge spanning a ravine
    collapsed, requiring rescuers to rappel nearly 150 feet, while others formed a
