- :title: Second Place - 2022 Chris Hondros Memorial International News
  :credit: Odelyn Joseph / Associated Press
  :caption: "Haiti has been gripped by inflation, causing rising food and fuel prices,
    and exacerbating protests that have brought society to the breaking point. Daily
    life in Haiti began to spin out of control last month just hours after the prime
    minister said fuel subsidies would be eliminated, causing prices to double. Political
    instability in Latin Americas poorest country had simmered ever since last years
    still-unsolved assassination of Haitis president Jovenel Mose, who had faced opposition
    protests calling for his resignation over corruption charges and claims that his
    five-year term had ended. \r\rPeople run after clashes erupted during a protest
    against fuel price hikes and to demand that Haitian Prime Minister Ariel Henry
    step down, in Port-au-Prince, Haiti, Friday, Sept. 16, 2022. "
