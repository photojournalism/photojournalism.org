- :title: First Place - 2022 Chris Hondros Memorial International News
  :credit: Luis Tato
  :caption: "7-month-old Samira Mohamed -who presents clear signs of malnutrition-
    is assessed by a nurse in a nutrition centre at Kabasa IDP camp in Doolow, Somalia
    on June 15, 2022. The Kabasa IDP camp in Doolow is growing quickly with many families
    displaced by drought coming to live there\r\rThe worst drought in four decades
    in the Horn of Africa -with four consecutive periods of rain lost- has combined
    with a global rise in food and fuel prices, pushed up by the war in Ukraine, to
    hit millions across the region, putting food staples out of reach for poor families
    and killing crops and livestock.\r\rUp to 20 million people in the Horn of Africa
    are facing the risk of starvation by the end of this year, according to the World
    Food Program. The most devastating crisis is unfolding in Somalia, where about
    seven million people face acute food shortages. The drought crisis, the war in
    Ukraine, the fight against Al-Shabab and a highly volatile security situation
    with political tensions have created a combination without precedents for Somalia.
    Since January, at least 448 children have dided from severe acute malnutrition
    according to UNICEF."
  :url: "https://photojournalism.s3.amazonaws.com/winners/2022/chris-hondros-memorial-international-news/first-place-ca72df/2022-chris-hondros-memorial-international-news-first-place-1-ca72df.jpg"
- :title: First Place - 2022 Chris Hondros Memorial International News
