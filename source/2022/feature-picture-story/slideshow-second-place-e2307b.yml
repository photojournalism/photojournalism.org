- :title: Second Place - 2022 Feature Picture Story
  :credit: Emilio Morenatti / Associated Press
  :caption: 'Ash from a volcano, that continues to erupt, covers a house on the Canary
    island of La Palma, Spain, Monday, Nov. 1, 2021. Scientists estimate the volcano
    also has ejected over 10,000 million cubic meters of ash. The ash is jettisoned
    thousands of meters into the sky, but the heaviest, thickest particles eventually
    give way to gravity. They accumulate into banks that slowly cover doors, pour
    into windows, make rooftops sag. Some particles are so big that when they pummel
    a car roof or the fronds of a banana tree, it sounds like hail. '
  :url: "https://photojournalism.s3.amazonaws.com/winners/2022/feature-picture-story/second-place-e2307b/2022-feature-picture-story-second-place-9-e2307b.jpg"
