  :credit: Ebrahim Noroozi / Associated Press
  :caption: "Drug addiction has long been a problem in Afghanistan, the worlds biggest
    producer of opium and heroin. The ranks of the addicted have been fueled by persistent
    poverty and by decades of war that left few families unscarred. \r\rBody of a
    dead addict lies covered by a shawl in an area inhabited by drug users under a
    bridge in Kabul, Afghanistan, Wednesday, June 15, 2022. "
