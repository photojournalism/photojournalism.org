  :caption: 'Kryslyn Stanley puts her earrings in, unable to avoid seeing her black
    eye in the mirror on August 2. Her daughter, Nyx, angrily pouts saying she wants
    to go to the pool at the Motel 6 where they are staying. Stanley was trying to
    get out the door to file a police report on her ex, Nyxs father, for the black
    eye he gave her the day before. Nyx has been picking up on her moms stress and
    has been acting out and throwing tantrums. The trauma of the abuse has been taking
    its toll on both mother and daughter as Stanley tries to hold everything together
    for her children. '
  :url: "https://photojournalism.s3.amazonaws.com/winners/2022/feature-picture-story/third-place-9718ab/2022-feature-picture-story-third-place-2-9718ab.jpg"
- :title: Third Place - 2022 Feature Picture Story
  :credit: Jessica Phelps / Newark Advocate
  :caption: "On August 12, less than two weeks after her ex gave her a black eye,
    Kryslyn Stanley changes the lock on her apartment door, so her ex can no longer
    use a key to get in. Stanley had to break in from the balcony because her ex had
    bolted the door shut from the inside and then climbed out a window. Something
    he had been doing since she left him. Stanley was already staying at a Motel 6
    because of conditions at her apartment. In her absence her ex had stolen her things,
    and brought multiple people to her apartment to do drugs. \rStanley had to work
    extra hours doing delivery driving to have enough money to buy the new lock and
    a screwdriver to change it. "
  :url: "https://photojournalism.s3.amazonaws.com/winners/2022/feature-picture-story/third-place-9718ab/2022-feature-picture-story-third-place-3-9718ab.jpg"
- :title: Third Place - 2022 Feature Picture Story
  :credit: Jessica Phelps / Newark Advocate
  :caption: "Kryslyn Stanley sits outside her Motel 6 room talking to a San Antonio
    Police Department detective about the police report she filed on her ex, while
    her daughter, Nyx, pokes her head out the door listening in, on August 4. Stanley
    was already situated at the Motel 6, she and other tenants at her apartment complex
    were given funding to stay there by the city of San Antonio because their air
    conditioning was not working while temperatures topped out in the triple digits.\rStaying
    at the Motel had been a huge blessing for Stanley, allowing her to escape deplorable
    conditions in her apartment at Seven Oaks, but also giving her space from her
    ex while he moved his stuff from her apartment. It did limit privacy and made
    it harder to have sensitive conversations with her young daughters overhearing. "
