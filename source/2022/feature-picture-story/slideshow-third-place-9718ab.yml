  :caption: 'Kryslyn Stanley is good a making chores fun for her daughters. Stanley
    who has been washing her clothes in her Motel 6 bathtub to save money has her
    daughter, Nyx step on the clothes with her to help get the soap to bubble. The
    distraction worked for a few minutes, and Nyx was able to laugh with her mom.
    The pair were just days after Stanley was given a black eye from Nyxs father.
    Nyx has not been handling the abuse and absence of her father well, forcing Stanley
    to put her trauma to the side to care for her daughter. '
