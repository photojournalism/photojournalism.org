    staying at the Motel 6 in July. The room was paid for by the city because their
    air-conditioning  in their apartment wasnt working and San Antonio was facing
    record hot summer. Moving to the motel wasnt the only difficult thing for Murphy
    over the summer. She had been witnessing her mom begin to fight back in a toxic
    relationship with her younger sisters father. '
