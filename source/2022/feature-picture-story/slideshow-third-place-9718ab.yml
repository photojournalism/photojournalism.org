  :credit: Jessica Phelps / Newark Advocate
  :caption: 'Kryslyn Stanley sits with her daughter, Nyx on a Motel 6 bed on August
    2. Both have been struggling with the aftermath of the black eye Stanley received
    from Nyxs father the day before. Stanley ended the relationship then and there,
    but Nyx has begun acting out by head butting people and throwing tantrums. Stanley
    has been doing her best to patiently explain to her young daughter that it is
    OK to feel big emotions and be upset, but that violence is not OK. Coping with
    her trauma as well as Nyxs has been extra taxing for Stanley who must also figure
    out to be a single mom. '
