- :title: Third Place - 2022 Feature Picture Story
  :credit: Jessica Phelps / Newark Advocate
  :caption: 'In order to save money, Kryslyn Stanley has been doing all of her laundry
    by hand in her Motel 6 bathtub. Stanley, a newly single mom, is stressed about
    having to find a new place to live, and paying all of her expenses after losing
    her job due to illness. Stanley is now doing delivery driving and often takes
    her daughters along with her. Its hard to be a single parent, Stanley said, but
    being a single parent without a support system is just cruel. Stanley left her
    partner, the father of her youngest daughter, just days before, after he left
    her with a black eye. She decided that was the last time he would hit her and
    ended the relationship.  '
  :url: "https://photojournalism.s3.amazonaws.com/winners/2022/feature-picture-story/third-place-9718ab/2022-feature-picture-story-third-place-8-9718ab.jpg"
