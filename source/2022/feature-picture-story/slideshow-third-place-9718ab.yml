- :title: Third Place - 2022 Feature Picture Story
  :credit: Jessica Phelps / Newark Advocate
  :caption: "Kryslyn Stanley is learning how to be a single mother after leaving her
    partner, and father of her youngest daughter, Nyx due to domestic violence. Their
    relationship had become toxic and emotionally abusive, but when she was given
    a black eye in August, Stanley decided she was finished. She found the strength
    to leave him and get a protective order for her and her two daughters. Stanley
    and her daughters, Nyx and Sylyn, were able to stay at a Motel 6 with city money
    earmarked for residents of her apartment complex who didnt have working air-conditioning
    in record Texas heat. This gave Kryslyn time and space to recover while her ex
    moved his things out of her place.  \rStanley has had to put off dealing with
    her trauma from the relationship while she helps her daughters heal. Her ex, who
    has been tracking her locations through her I-phone, will show up at random places
    out of the blue, further traumatizing their daughter, Nyx. Nyx has been acting
    out with violent tantrums while Kryslyn patiently explains to her that it is OK
    for her to feel big things but she must control her actions. Stanley is worried
    about the long term impacts of this experience on her daughters, but is working
    hard to ensure her daughters both feel safe and have the space to work through
    their emotions. \r\rKryslyn Stanley watches over her daughter, Nyx, while they
    wait for the bus, September 20. The pair had just eaten their grocery store dinner
    on the bus stop bench when Nyxs balloons blew into the street. Nyx held tightly
    to them after they were recovered. Stanley was forced to use the bus system after
    her car was repossessed, meaning she was unable to earn money doing delivery driving
    putting her further behind in getting back on her feet after leaving her ex. "
  :url: "https://photojournalism.s3.amazonaws.com/winners/2022/feature-picture-story/third-place-9718ab/2022-feature-picture-story-third-place-1-9718ab.jpg"
