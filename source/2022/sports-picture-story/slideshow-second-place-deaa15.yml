- :title: Second Place - 2022 Sports Picture Story
  :credit: Jordi Cohen
  :caption: 'Bullfighting: art, religion and death. This series aims to explore the
    relationships between bullfighting, art, religion and death. In Spain, although
    there are opposing opinions, this practice is considered by many as an art, part
    of the cultural heritage. In addition, there is a strong link with religion, since
    most bullfighters are deeply religious. And lastly, death in the bullring, like
    that inescapable end at the end of a bullfight.'
  :url: "https://photojournalism.s3.amazonaws.com/winners/2022/sports-picture-story/second-place-deaa15/2022-sports-picture-story-second-place-1-deaa15.jpg"
