- :title: First Place - 2022 Sports Picture Story
  :credit: Angelos Tzortzinis / AFP
  :caption: "Prince is training at a basketball court in Athens on October 16, 2022.
    Eighteen year old Prince is a second-generation migrant in Greece. He does not
    have a Greek citizenship even though he was born in Greece. \r\rI met these children
    at the basketball courts of my neighborhood in the center of Athens. They love
    basketball and live for it, they play to forget their problems. They are second-generation
    migrants in Greece. Unfortunately they do not have the same luck of the superstar
    basketball player Giannis Antetokounmpo, as they do not have Greek citizenship
    even though they were born in Greece, speak Greek and study in Greece. Greek goverment
    gave Greek citizenship to Giannis Antetokounmpo through special procedures in
    2013, but did not took care to restore the gap for citizenship for the rest second-generation
    migrants. These children know that they will not become superstar basketball players
    but they hope to have the opportunities to claim a better future for themselves
    and their families."
  :url: "https://photojournalism.s3.amazonaws.com/winners/2022/sports-picture-story/first-place-b3a874/2022-sports-picture-story-first-place-1-b3a874.jpg"
