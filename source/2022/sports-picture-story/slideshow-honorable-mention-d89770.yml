- :title: Honorable Mention - 2022 Sports Picture Story
  :credit: Matt Mcclain / The Washington Post
  :caption: "In order to keep disputes from causing violence in the community, Chris
    Wilmore started Streetbeefs a decade ago. The monthly fighting events, that meet
    in a homeowners country field in Virginia, give people the chance to settle their
    problems in the ring with boxing, mixed martial arts and kick boxing. There are
    also matches that don't involve a grudge. \r\rAmeil Barbour warms up before his
    fight during a Streetbeefs event on Saturday December 04, 2021 in Winchester,
    VA. Chris Wilmore started Streetbeefs to keep violence from erupting in communities
    and to solve the disagreements in the ring. The event had boxing and mixed martial
    arts. "
