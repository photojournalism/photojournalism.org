  :credit: Emilio Morenatti / Associated Press
  :caption: "There is a cost to war  to the countries that wage it, to the soldiers
    who fight it, to the civilians who endure it. For nations, territory is gained
    and lost, and sometimes regained and lost again. But some losses are permanent.
    Lives lost can never be regained. Nor can limbs. And so it is in Ukraine. The
    stories of the people who undergo amputations during conflict are as varied as
    their wounds, as are their journeys of reconciliation with their injuries. For
    some, losing a part of their body can be akin to a death of sorts; coming to terms
    with it, a type of rebirth.\r\r\rAnton Gladun, 22, lies on his bed at the Third
    City Hospital, in Cherkasy, Ukraine, Thursday, May 5, 2022. Anton, a military
    medic deployed on the front lines in eastern Ukraine, lost both legs and the left
    arm due to a mine explosion on March 27. "
  :url: "https://photojournalism.s3.amazonaws.com/winners/2022/best-portfolio/first-place-a0b99b/2022-best-portfolio-first-place-29-a0b99b.jpg"
