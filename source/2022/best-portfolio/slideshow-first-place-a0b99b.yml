  :caption: 'Ash from a volcano, that continues to erupt, covers a house on the Canary
    island of La Palma, Spain, Monday, Nov. 1, 2021. Scientists estimate the volcano
    also has ejected over 10,000 million cubic meters of ash. The ash is jettisoned
    thousands of meters into the sky, but the heaviest, thickest particles eventually
