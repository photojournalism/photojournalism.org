- :title: First Place - 2022 Best Portfolio
  :credit: Emilio Morenatti / Associated Press
  :caption: "All will disappear as a blizzard of dark ash blows from a volcano on
    La Palma island and drifts to the ground inch by inch, foot by foot. Inside the
    exclusion zone, there is destruction by lava as well as burial in a sepulcher
    of black snow. A living room furnished with a hammock sits empty in the final
    hours before an implacable tongue of molten rock crushes an entire house.  Whether
    the end comes from lava or from ash, homes and fields located below the Cumbre
    Vieja volcano face annihilation in slow motion. Since the eruption started on
    Sept. 19,  authorities have declared over 20,000 acres (8,200 hectares) between
    the Cumbre Vieja volcano and the Atlantic Ocean off-limits. Only police, soldiers,
    and scientists are allowed to move freely in the exclusion zone, which cuts La
    Palmas western shore in two. The lush land previously approximated an earthly
    paradise for both residents and visitors. Spaniards and other Europeans spent
    vacations or retired here to be near the sea, while locals harvested banana trees
    in the semi-tropical warmth of Spains Canary Islands. Now, evacuated residents
    line up in cars and trucks on the zone's edge, awaiting permission to make escorted
    trips home to rescue their dearest possessions, or at least see their endangered
    properties. Human time and geological time were brought into sync by the volcano.
    What once seemed a given - the land beneath people's feet - becomes as fluid and
    unpredictable as the lives the eruption threw into tumult. The creep of the lava,
    the build-up of ash, are matched by the growing anguish of the men and women whose
    way of life is being erased. Silence would reign in the exclusion zone if it werent
    for what residents have named the beast. The volcanos constant roar makes conversation
    almost impossible, nearly drowns out both the barking of abandoned dogs and the
    murmur of a flock of passenger pigeons circling the sky in search of a coop that
    no longer exists. This series chronicles the takeover. \r\rLava flows from a volcano
    on the Canary island of La Palma, Spain, Tuesday, Nov. 30, 2021. Several new volcanic
    vents opened in La Palma, releasing new lava that flowed fast down a ridge and
    threatened to widen the impact on evacuated land, infrastructure and homes. "
  :url: "https://photojournalism.s3.amazonaws.com/winners/2022/best-portfolio/first-place-a0b99b/2022-best-portfolio-first-place-18-a0b99b.jpg"
