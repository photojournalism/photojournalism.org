  :caption: "Sarah and her family spend time in the yard on Wednesday, Sept. 22, 2022
    in Excelsior Springs. I love my kids more than anything in the world, Sarah said.\r\rSarah
    Robbins, 32, is the glue that keeps her family together. With five kids ranging
    from 9 months to 14 years old, she is constantly doing the best to keep order
    in their tightly-packed mobile home. She goes from changing diapers one moment,
    to dealing with a teenager being suspended from school the next. AJ, Sarahs fianc
    of eight years, recently returned to the workforce, which means that Sarah is
    shouldering more of the parental responsibilities at home. Sarah deals with trauma
    from her ex-partner who fathered her two teenage sons, while also suffering from
    postpartum depression following the birth of her youngest nine months ago. Ive
    lived a long life, Sarah said. And with this, Sarah vows to protect her kids the
    best she can. My kids are my life, I wouldnt be alive if it werent for them.\r\r(METADATA
    DATES ARE WRONG, ALL IMAGES IN STORY TAKEN SEPTEMBER 2022 FOR 74TH MISSOURI PHOTO
    WORKSHOP)."
