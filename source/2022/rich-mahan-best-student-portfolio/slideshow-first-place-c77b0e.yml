  :caption: "Aaron King waits for his turn to do pad work at Zens Gym in Columbia,
    Mo., Monday, Jan. 31, 2022. King says he attributes his gym and its trainers for
    his recovery from alcoholism. They werent why I started changing as a person,
    but they were a place where I was able to change, so I owe a lot of that to them.\r\r\rUnlike
    his stance, Aaron Kings path to boxing has been unorthodox, to say the least.
    The 23-year-old pro boxer only started training less than two years ago. The in-shape
    fighter who had his pro debut in February was unrecognizable when he first began
    \ not only in appearance but as a person. I think I wasnt in the drivers seat
    for a lot of years of my life. And any opportunities that I had to take control,
    I think I let slip away, either because I was too scared of that responsibility
    or because I was getting into alcohol. After seeing a loved one hit their lowest,
    King decided to go cold turkey in April 2021. Although he doesnt solely credit
    the boxing gym for making him sober, he credits the gym and the people there for
    giving him a place to change. And after a year being sober, King says he will
    be a champion one day, whether on a local level or world. If I do my very best,
    then where Ill be able to end up is very, very high.\""
