- :title: Third Place - 2022 Feature
  :credit: Luis Tato
  :caption: "Elephant keeper Kiapi Lakupanai plays with two calves at Reteti Elephant
    Sanctuary in Namunyak Wildlife Conservancy, Samburu, Kenya on October 12, 2022.\r\rReteti
    Elephant Sanctuary has been overwhelmed with rescue operations and the influx
    of orphaned and abandoned calves due to the current drought in Namunyak Wildlife
    Conservancy where they operate. Parched lands and dry wells cover the terrain
    leading to many baby elephants to lose their exhausted mothers, or get abandoned
    or lost.\r\rEast Africas worst drought in forty years is starving Kenyas famed
    wildlife of usual food and water sources while increasing human-wildlife conflict.
    The severe drought has not only put millions of people on the brink of starvation,
    but it is also threatening the rich biodiversity in the region."
  :url: "https://photojournalism.s3.amazonaws.com/winners/2022/feature/2022-feature-third-place-11d9c2.jpg"
