- :title: First Place - 2024 Feature
  :credit: Carol Guzy
  :caption: "Erica Grieg kisses a beloved iconic cherry blossom tree named Stumpy
    that bloomed for the final time at the Tidal Basin in Washington DC on March 20,
    2024.  \r\rTrees are poems the earth writes upon the sky wrote poet Kahlil Gibran.
    \r\rHis final bloom was glorious with admirers bidding a sorrowful farewell as
    a renovation project for the eroding sea wall was set to begin by the National
    Park Service.  Approximately 300 trees will be removed, including Stumpy, a cautionary
    tale of climate change. He became a symbol of resilience, a miracle in our midst,
    blooming his little heart out despite the frail weathered condition of his fragile
    shell. He captured our imaginations, inspiring those who feel broken to transcend
    adversity.  \r\rStumpys destiny was dictated by NPS with no regard to the pulse
    of the people. Citizens overwhelmingly voiced their desire to Save Stumpy as a
    national treasure. There were petitions. Many believed at least giving him a chance
    by transplanting was appropriate.  Just try, they said. Another viable alternative
    was a Smithsonian request for preservation in the permanent museum collection.
    It too was rejected. \r\rPeople refer to Stumpy as he.  Sometimes she.  Seldom
    it.  Some wrote love notes as an act of protest against his removal. Others left
    memorial flowers and in one case, a bottle of Makers Mark.  At this troubled time
    in our world, he offered promise. Something a fractured partisan nation could
    rally around. \r\rPeople saw him as an underdog, a symbol of hope, a metaphor
    for our democracy. Mommy why are they killing him? said one little girl. A lady
    remarked: They always try to cut us down when we get older. \r\rPsychologist Evelyn
    Sawhill made an origami crane and tucked it into Stumpys peeling bark, whispering,
    Dont be afraid.  She pondered existential questions: Do trees have emotions? Feel
    pain?  Do they have a soul that moves on somewhere in this mystery called life?
    \ She believes Stumpy felt the love by those who stayed so he wouldnt be alone.
    Offering recognition and comfort and solace and understanding to any living thing
    is important.  People who have come to do that for Stumpy have benefited more
    than we think.  And it is an honor, she declared.\r\rThe final days were bittersweet
    and poignant.  A rainbow appeared as if all of nature was offering Stumpy a grand
    goodbye.  \r\rThis tale has greater meaning than the fate of one little tree.
    \ It is about our capacity to care and nurture rather than destroy so much in
    our path. When you erase beauty, it is an affront to the soul.  And yes, many
    found this misshapen marvel a magnificent work of art.   \r\rUnder a veil of secrecy,
    shrouded by black mesh fencing and amid the carnage of other felled trees, Stumpy
    met his demise. He was so little, it took mere minutes. \r\rOn this last sunrise,
    birds flocked near the isolated cage. One could imagine them bidding him farewell.
    \ Nature has an intricate language that humans have long forgotten.\r\rIn The
    Wizard of Oz, Dorothy said, Theres no place like home.  National parks are part
    of our collective home to nurture and protect. No one questions the need for renovation,
    simply the decisions made by NPS with no regard for the will of the people. Perhaps
    American citizens deserve a more compassionate steward of our land.  There is
    now an empty space where beauty once lived.  One can imagine Stumpy somewhere
    over that rainbow, tall and majestic with eternal blooms.  \r\rRest now Stumpy
    your journey is over. We will miss you dear little one.  You were loved.\r"
  :url: "https://photojournalism.s3.amazonaws.com/winners/2024/feature/2024-feature-first-place-196a0c.jpg"
