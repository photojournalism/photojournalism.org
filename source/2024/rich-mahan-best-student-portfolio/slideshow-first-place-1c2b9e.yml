  :caption: "Caption:\rA group of the young dancers at Dance Arts Gillette warm up
    as the studio holds their last dress rehearsal May 23, 2024, ahead of their performance,
    The Sleeping Beauty at the Cam-plex Heritage Center Theater in Gillette, Wyo.
    \r\rDescription: Gillette on the Precipice\rCampbell County, Wyo., a small county
    of Northeastern Wyoming known as the Energy Capital of the Nation, is at a turning
    point in its history. Founded and sustained off the energy industry that houses
    several of the largest open-pit coal mines in the world, Campbell County is pushing
    to create economic stability for its future.\r\rThis county within the Cowboy
    State is certainly home to its fair share of ranchers and contemporary cowboy
    legends, but it also home to a budding tourism industry. The county has used the
    mineral taxes it has received to bolster local amenities and provide a high quality
    of life for its residents. \r\rIt has survived booms and busts in the energy industry
    and will likely see one or the other following this presidential election. The
    town will undoubtedly persevere, but it is at a crossroads where it can either
    fully commit to diversifying its economy or stay predominately reliant on fossil
    fuels.\r\rThis project Gillette on the Precipice looks to freeze a moment in time
    ahead of a period of great change for Campbell County and its residents."
  :url: "https://photojournalism.s3.amazonaws.com/winners/2024/rich-mahan-best-student-portfolio/first-place-1c2b9e/2024-rich-mahan-best-student-portfolio-first-place-17-1c2b9e.jpg"
