- :title: 2024 Rich Mahan Best Student Portfolio
  :credit: Luke Johnson
  :caption: "Caption:\rSelah Brunner practices her routine on the balance beam June
    11, 2024, as her coach Genetha Tolar helps Lily Gomez, 9, with hers at Wyoming
    Academy of Gymnastics and Dance in Gillette, Wyo.\r\rDescription: Selahs Story\rWatching
    the local production of The Sleeping Beauty ballet, one bubbly ballerina stands
    out from the rest. Not because shes better or worse than any of the other dancers,
    but because she dances with a colorful prosthetic leg.\r\rThis dancer is an 8-year-old
    girl named Selah Brunner, who was born without her left leg.\r\rAdopted from Nanchang,
    China, when she was just 18 months old, Selah has seamlessly fit into the Brunner
    family and the wider Gillette community.\r\rShe can easily make friends. She doesnt
    look at missing her limb as a handicap, said her father Paul Brunner. Shes touched
    a lot of peoples lives being a part of our community, a lot of people know her
    and absolutely adore her.\r\rMore than a dancer, Selah also participates in gymnastics
    and runs track among other things. Like any kid her age she spends time with friends
    and family doing the things that she loves. Unlike many of those other kids, Selah
    also goes to weekly physical therapy appointments and regular prosthesis appointments.\r\rWorking
    with certified prosthetist-orthotist Brodie Rice at Pivot Prosthetics and Orthotics
    since she started to walk, Selah has gotten better at using her prosthetic leg.\r\rRice
    works closely with Selah to build and tweak her prosthesis so that it is comfortable,
    controllable and functional. Rice highlights that for someone Selahs age and size,
    having a prosthesis with a functioning knee joint is extremely challenging to
    control. Through determination and an uplifting support system Selah has continued
    to improve with a prosthetic leg that often gives adults trouble.\r\rShe overcomes
    most everything, she finds that when theres a will theres a way, said physical
    therapist Lisa Haugen.\r\rWhile Selahs story is filled with triumph and perseverance
    there have also been struggles, specifically with running.\r\rI can tell it breaks
    her heart, its hard for her to try to understand why she cant physically keep
    up with other kids in that way, Paul said.\r\rHe said that in all other aspects
    she can keep up with them and soon will be able to run as well, but itll continue
    to take some time.\r\rUnfortunately there is just not as many things available
    for a pediatric leg as there is for an adult leg. So as you get taller and you
    can fit into more of those adult components that open a whole new world of things
    you can do with that leg, said Haugen. I see her function continuing to grow as
    we are able to put those better components on that.\r\rThanks to her tenacity
    and determination the future is bright for Selah.\r\rIm just excited to see, as
    she gets bigger and continues to grow, we will be able to use more and more prosthetic
    technology to help her continue to develop even further, Rice said. Shes going
    to not really have any limitations.\r\rHearing stories of how Selah plays at the
    park or competes at gymnastics practice, you would never think of her as different
    than any of the other kids. She certainly doesnt think so. A ball of endless energy
    with an infectious smile and a personality that can brighten anyones day, Selah
    continues to inspire others by living what is her own normal life."
  :url: "https://photojournalism.s3.amazonaws.com/winners/2024/rich-mahan-best-student-portfolio/first-place-1c2b9e/2024-rich-mahan-best-student-portfolio-first-place-7-1c2b9e.jpg"
