- :title: Second Place - 2024 Domestic (U.S.) General News Picture Story
  :credit: Matt McClain / The Washington Post
  :caption: "A total solar eclipse was visible to a large portion of North America
    on April 8, 2024. One city that was in the middle of the path of totality was
    Bloomington, IN. The college town that is home to Indiana University esperienced
    over four minutes of darkness as the moon covered the sun. There were many events
    around town leading up to the eclipse. \r\rThe total solar eclipse is seen as
    people gather at the Tibetan Mongolian Buddhist Cultural Center on Monday April
    8, 2024 in Bloomington, IN. The area is in the path of Mondays total solar eclipse.
    The center partnered with Indiana Forest Alliance for the event. "
