  :credit: Luke Johnson
  :caption: "Caption:\rJoe Pridgen holds his five-month-old daughter Samarra as she
    wakes up Aug. 31, 2024, in their apartment in Missoula, Mont. Since Joe usually
    has early morning workouts, he is often the one making breakfast for his wife
    and daughter. He also likes to spend that time before practice holding his daughter
    ahead of his busy day.\r\r\rDescription: The Transfer\rJoe Pridgen and his wife
    Grace recently moved from Boston to Missoula with their five-month-old daughter
    Samarra after Joe signed to continue his collegiate basketball career at the University
    of Montana.\r\rBalancing fatherhood, academics and athletics, Joe prioritizes
    being a partner to Grace and a father to Samarra. They work together to create
    stability and establish routine amidst the unpredictability of raising a baby.
    \r\rEverything from being a father to living in Missoula is new to Joe as he works
    to find his identity within his new team and young family. "
