- :title: Third Place - 2024 Sports Picture Story
  :credit: Scott Strazzante / San Francisco Chronicle
  :caption: "The Last Stand \rSummary- In late September 2024, the Oakland Athletics
    played their final homestand after 57 seasons of major league baseball at the
    Oakland Coliseum. The last six games gave the teams heartbroken fan base a chance
    to celebrate and mourn before the As move to Sacramento for several years before
    finally relocating in Las Vegas.\r\rCaption- Oakland Athletics fan Paul Martin
    of Oakland soaks in the atmosphere as he watches the As play New York Yankees
    from the right field upper deck during final home stand at Oakland Coliseum in
    Oakland, Calif., on Saturday, September 21, 2024. \r"
  :url: "https://photojournalism.s3.amazonaws.com/winners/2024/sports-picture-story/third-place-0f589a/2024-sports-picture-story-third-place-1-0f589a.jpg"
