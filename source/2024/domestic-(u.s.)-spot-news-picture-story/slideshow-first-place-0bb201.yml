- :title: First Place - 2024 Domestic (U.S.) Spot News Picture Story
  :credit: Evan Vucci / Associated Press
  :caption: "On July 13, 2024 former president Donald Trump survived an assassination
    attempt while speaking at an open-air campaign rally in Butler, Pa. Trump was
    shot and wounded in his upper right ear by Thomas Matthew Crooks, a 20-year-old
    man from Bethel Park, Pennsylvania, who fired eight rounds from an AR-15style
    rifle from the roof of a nearby building. Crooks also killed one audience member
    and critically injured two others. He was subsequently shot and killed by the
    United States Secret Service's Counter Sniper Team. \r\rRepublican presidential
    candidate former President Donald Trump arrives for a campaign rally, Saturday,
    July 13, 2024, in Butler, Pa. "
