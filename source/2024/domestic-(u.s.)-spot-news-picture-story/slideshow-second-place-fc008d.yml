- :title: Second Place - 2024 Domestic (U.S.) Spot News Picture Story
  :credit: Carol Guzy
  :caption: "A Shelter in Place sign is illuminated as the search continues amid autumn
    leaves and deserted streets for mass shooting suspect Robert Card in Lewiston,
    ME on Friday October 27, 2023.  18 people were killed and 13 wounded in the assault
    and residents remained indoors in fear.\r\rLife forever changed in Lewiston Maine
    after the gunman entered Just-in-Time Recreation Center and opened fire with an
    assault weapon. Then headed to Schemengees Bar & Grill continuing the killing
    rampage. \r\rCommunity members gathered for sorrowful vigils and funerals began,
    including for interpreter Joshua Seal mourned by his wife and four children, all
    deaf.  Final farewells took place, but the grief of a shattered community continued.
    \ The debate about gun prevention rages on while the body count rises amid 656
    mass shootings this year."
