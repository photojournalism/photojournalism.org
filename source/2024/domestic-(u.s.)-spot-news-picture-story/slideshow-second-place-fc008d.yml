- :title: Second Place - 2024 Domestic (U.S.) Spot News Picture Story
  :credit: Carol Guzy
  :caption: "Townspeople gather after the tragic Lewiston mass shooting for a vigil
    at the Basilica of Saints Peter & Paul in Lewiston, ME on Tuesday October 29,
    2023. After each name was read, a bell tolled.  The community came together in
    collective grief and healing.\r\rLeroy Walker, an Auburn City Councilor, was in
    the crowd. His son Joseph was credited with trying to stop the gunman. He died
    as a hero, said Leroy who was strong until there was a glimpse of someone that
    looked like Joey, then broke down in tears. The heart doesnt stop bleeding.' But
    that heart harbors no hate for the gunman."
  :url: "https://photojournalism.s3.amazonaws.com/winners/2024/domestic-(u.s.)-spot-news-picture-story/second-place-fc008d/2024-domestic-(u.s.)-spot-news-picture-story-second-place-9-fc008d.jpg"
- :title: Second Place - 2024 Domestic (U.S.) Spot News Picture Story
  :credit: Carol Guzy
  :caption: "Elizabeth Seal, wife of Joshua Seal, 36 an ASL interpreter killed by
    a Lewiston mass shooter, uses sign language for I love you as she gives a eulogy
    over his body during the funeral at The Point in South Portland, ME on Friday
    November 8, 2023.  He leaves behind his wife and four children, who are all deaf.
    \ \r\rElizabeth greeted the hundreds paying respects to a beloved man with quiet
    dignified grace. Later she gently touched his forehead as a final farewell in
    the empty room after services concluded. Her words: As we left the church late
    at night, the pups pointed out one lone star shining in the sky. I didnt notice
    any other stars. Just that one shining brightly. They said it was Dad.\r\rShe
    highlighted the necessity for interpreters during any emergency and her frustration
    seeking information during those first awful hours.  She understands the need
    for guns. But an AR-style rifle. Why? she questions.\r"
  :url: "https://photojournalism.s3.amazonaws.com/winners/2024/domestic-(u.s.)-spot-news-picture-story/second-place-fc008d/2024-domestic-(u.s.)-spot-news-picture-story-second-place-10-fc008d.jpg"
- :title: Second Place - 2024 Domestic (U.S.) Spot News Picture Story
  :credit: Carol Guzy
  :caption: "Sephine Seal, 9 years old, daughter of Joshua Seal, an ASL interpreter
    killed by a Lewiston mass shooter, weeps while viewing his body during funeral
    services at The Point in South Portland, ME on Friday November 8, 2023. He leaves
    behind his wife Elizabeth Seal and four children who are all deaf. Losing a parent
    while so young leaves an eternal hole in the hearts of children.  \r\rJoshua Seal
    was at Schemengees Bar & Grill that had been hosting a corn hole tournament for
    the deaf community when the gunman entered.  He was known by all to be an attentive
    father to their Seal pups and part of his legacy was a deaf camp for children
    he established in Maine."
  :url: "https://photojournalism.s3.amazonaws.com/winners/2024/domestic-(u.s.)-spot-news-picture-story/second-place-fc008d/2024-domestic-(u.s.)-spot-news-picture-story-second-place-11-fc008d.jpg"
- :title: Second Place - 2024 Domestic (U.S.) Spot News Picture Story
  :credit: Carol Guzy
  :caption: "Elizabeth Seal, wife of Joshua Seal, 36 an ASL interpreter killed by
    a Lewiston mass shooter, gently touches his forehead and bids a final farewell
    in the empty room after funeral services conclude at The Point in South Portland,
    ME on Friday November 8, 2023. He leaves behind his wife and four children, who
    are all deaf. \r\rElizabeth and Joshua first met in pre-school and later love
    blossomed.  He was Director of Interpreting Services at Pine Tree Society and
    an advocate for the deaf.  He enjoyed traveling, sports and died playing what
    he loved, corn hole.  Schemengees Bar & Grill had been hosting a tournament for
    the deaf community when the gunman entered.  \r\rHer words: As we left the church
    late at night, the pups pointed out one lone star shining in the sky. I didnt
    notice any other stars. Just that one shining brightly. They said it was Dad.\r\rShe
    highlighted the necessity for interpreters during any emergency and her frustration
    seeking information during those first awful hours.  She understands the need
    for guns. But an AR-style rifle. Why? she questions.\r"
