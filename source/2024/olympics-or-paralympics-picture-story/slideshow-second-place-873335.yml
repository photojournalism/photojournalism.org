- :title: Second Place - 2024 Olympics or Paralympics Picture Story
  :credit: David Goldman / Associated Press
  :caption: 'The setting sun lights up the golden entrance to the Chateau de Versailles
    as a worker greets guests for an event on the palaces grounds which is hosting
    the equestrian events at the 2024 Summer Olympics, Friday, Aug. 2, 2024, in Versailles,
    France. Once the residence of French royalty, the chateau is one of the most popular
    tourist spots in Paris. Under the monarchy, horses were used by the royal family,
    its entourage and visitors to go hunting, show their equestrian skills and enjoy
    rides in the Versailles gardens. They were an essential part of festivities and
    a symbol of the king''s power. '
  :url: "https://photojournalism.s3.amazonaws.com/winners/2024/olympics-or-paralympics-picture-story/second-place-873335/2024-olympics-or-paralympics-picture-story-second-place-5-873335.jpg"
