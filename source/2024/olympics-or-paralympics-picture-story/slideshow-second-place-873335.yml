- :title: Second Place - 2024 Olympics or Paralympics Picture Story
  :credit: David Goldman / Associated Press
  :caption: 'A crowd takes photos at the gates to the Tuileries Garden as the cauldron
    rises at sunset during the 2024 Summer Olympics, Saturday, July 27, 2024, in Paris.
    Over ten thousand athletes from over two hundred counties descended on the City
    of Love for these Games. But while spectators poured into stadiums across the
    city, everyday scenes unfolded on street corners and in front of iconic landmarks
    set against the backdrop of the Summer Olympics, all the while with a French flair.
    A busker in a tuxedo played his tuba for those passing by a museum, folks gathered
    for salsa dancing in city square, even a protest against the Games in the famed
    Republique plaza and of course, a marriage proposal in front of the Eiffel Tower
    adorned with the Olympic rings. And as historic settings such as the Chateau de
    Versailles became venues for sport, the street of Paris became a venue for the
    joy and wonder of a summer romance. '
  :url: "https://photojournalism.s3.amazonaws.com/winners/2024/olympics-or-paralympics-picture-story/second-place-873335/2024-olympics-or-paralympics-picture-story-second-place-1-873335.jpg"
