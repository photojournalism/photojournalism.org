- :title: Second Place - 2024 Olympics or Paralympics Picture Story
  :credit: David Goldman / Associated Press
  :caption: 'Protesters release smoke in the colors of the Olympic rings during a
    demonstration by several associations for what they called the "Counter Opening
    Ceremony" on Republique plaza against the 2024 Summer Olympics, Thursday, July
    25, 2024, in Paris, France. Demonstrators gave speeches about the cost of the
    Olympic Games and said authorities have been using the Games as a pretext for
    what they call social cleansing, by removing migrants and homeless people off
    the streets in order to preserve a picture-postcard image of the city for the
    millions of visitors coming. '
  :url: "https://photojournalism.s3.amazonaws.com/winners/2024/olympics-or-paralympics-picture-story/second-place-873335/2024-olympics-or-paralympics-picture-story-second-place-7-873335.jpg"
