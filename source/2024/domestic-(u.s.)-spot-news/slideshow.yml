    in Butler, Pa., July 13, 2024. \r\rOn July 13, 2024 Trump survived an assassination
    attempt while speaking at the open-air campaign rally. Trump was shot and wounded
    in his upper right ear by Thomas Matthew Crooks, a 20-year-old man from Bethel
    Park, Pennsylvania, who fired eight rounds from an AR-15style rifle from the roof
    of a nearby building. Crooks also killed one audience member and critically injured
    two others. He was subsequently shot and killed by the United States Secret Service's
    Counter Sniper Team. "
