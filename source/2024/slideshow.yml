- :title: First Place - 2024 Feature Picture Story (Excerpt)
  :credit: Rodrigo Abd / Associated Press
  :caption: "Paraguay a few months ago launched an operation to address some of the
    many problems plaguing its prison system, including internal gang control, but
    one problem in particular has proven difficult to deal with: overcrowding. The
    South American nation has 18 prisons with a capacity for almost 10,000 inmates,
    but the current population exceeds 17,600, according to the latest figures provided
    by authorities which go until the end of 2023.\rA country of more than 6 million
    inhabitants, Paraguay is considered a regional drug trafficking hub.\r\r\rPrisoners
    peer from their group cell in the late afternoon, to be unlocked in the morning,
    as another prisoner prepares to enter another group cell to be locked for the
    night at the Regional Penitentiary in Villarica, Paraguay, Saturday, Aug. 31,
    2024. "
  :url: "https://photojournalism.s3.amazonaws.com/winners/2024/feature-picture-story/first-place-5353a0/2024-feature-picture-story-first-place-1-5353a0.jpg"
