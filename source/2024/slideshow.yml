  :caption: "Republican presidential candidate former President Donald Trump is surrounded
    by U.S. Secret Service agents after an assassination attempt at a campaign rally
    in Butler, Pa., July 13, 2024. \r\rOn July 13, 2024 Trump survived an assassination
    attempt while speaking at the open-air campaign rally. Trump was shot and wounded
