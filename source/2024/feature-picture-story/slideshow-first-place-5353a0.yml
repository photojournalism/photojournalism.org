  :credit: Rodrigo Abd / Associated Press
  :caption: 'An inmate uses a phone as another gives the number to dial at a pay-by-the-minute
    phone booth set up and run by prisoners at the Regional Penitentiary in Villarica,
    Paraguay, Sunday, Sept. 1, 2024. Most inmates'' calls get paid for by their families
    when they come to visit in person. '
