- :title: Second Place - 2024 Feature Picture Story
  :credit: Arvin Temkar / Atlanta Journal Constitution
  :caption: "This series documents the artistry and soul that goes into Black funerals.
    Despite sorrowful, solemn and sometimes tragic circumstances, Black funerals are
    often marked by a spirit of celebration. A homegoing, as the Black Christian tradition
    is called, commemorates the return of the deceased to the Lord. I spent three
    months behind the scenes at Willie Watkins Funeral Home in Atlanta, attending
    services, following employees on their daily duties and talking to bereaved families.\r\rCarroll
    Brown (second from right), mother-in-law of Marcus Johnson, 50, walks away after
    viewing Johnsons casket in Lithonia, Georgia on Friday, November 10, 2023."
  :url: "https://photojournalism.s3.amazonaws.com/winners/2024/feature-picture-story/second-place-bd8e6d/2024-feature-picture-story-second-place-1-bd8e6d.jpg"
- :title: Second Place - 2024 Feature Picture Story
  :credit: Arvin Temkar / Atlanta Journal Constitution
  :caption: A funeral attendant carries a crown for Beverly Brown, 69, at Willie Watkins
    Funeral Home chapel in Atlanta on December 30, 2023. For those who choose a crowning
    ceremony, a tiara or crown is placed on the head of the deceased before closing
    the casket to represent the concept of becoming royalty in heaven.
  :url: "https://photojournalism.s3.amazonaws.com/winners/2024/feature-picture-story/second-place-bd8e6d/2024-feature-picture-story-second-place-2-bd8e6d.jpg"
- :title: Second Place - 2024 Feature Picture Story
  :credit: Arvin Temkar / Atlanta Journal Constitution
  :caption: Christine King Farris, Martin Luther King Jr.s last surviving sibling,
    lies in state at the Georgia Capitol in 2023. She was only the fourth Black Georgian
    to lie in state at the Capitol, and Willie Watkins Funeral Home performed the
    services for all of them, including Coretta Scott King, John Lewis and C.T. Vivian.
