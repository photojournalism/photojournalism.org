- :title: Second Place - 2024 Feature Picture Story
  :credit: Arvin Temkar / Atlanta Journal Constitution
  :caption: Justin Mayes applies makeup to Betty Lue Surry, 88, at Willie Watkins
    Funeral Home in Atlanta on Jan. 5, 2024.  Mayes, 30, has been working with Willie
    Watkins Funeral Home since he was 17. He became interested in working at a funeral
    home when he saw the body of a friend who died in an accident. I was expecting
    her to look really bad, he says, but she just looked asleep. As a mortician, he
    describes himself as a perfectionist. I always say, How would they look in heaven?
