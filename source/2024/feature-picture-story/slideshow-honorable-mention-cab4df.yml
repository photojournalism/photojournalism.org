  :caption: "Wayne Roberts reaches over and touches his wife Lynne Roberts shoulder
    as she gazes out a window in their home on Thursday, Aug. 24, 2023 in Butte. Ive
    been preparing for this for 13 years, Wayne said while speaking about being Lynnes
    caregiver. She was 9 years older than I was when I married her. I thought this
    might be something that I would have to do.\r\rThis project is a picture story
    about end-of-life caregiving that follows Wayne Roberts providing care to his
    late wife, Lynne Roberts, over the course of 11 months, and will explore the rigors
    and rewards of family caregiving and the different stages of dying. "
