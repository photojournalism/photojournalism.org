  :credit: Joseph Scheller
  :caption: Wayne Roberts and a family friend who asked not to be identified sit with
    Lynne in what they expect to be her last day of life, on Monday, May 27, 2024.
    Its a conflict. I want to take care of her, I want her to be happy. And I want
    her to die, said Wayne. Its the worst thing. I mean shes been a free spirit her
    whole life and then to have someone tell you that you cant get out of bed ever
    again? How do you reconcile those two feelings?
  :url: "https://photojournalism.s3.amazonaws.com/winners/2024/feature-picture-story/honorable-mention-cab4df/2024-feature-picture-story-honorable-mention-10-cab4df.jpg"
