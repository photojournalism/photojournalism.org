- :title: Honorable Mention - 2024 Feature Picture Story
  :credit: Joseph Scheller
  :caption: 'The Roberts sleep next to each other in their recliners early morning
    on Wednesday, March 6, 2024. Three nights a week when Wayne delivers papers into
    the early morning, he cat-naps between finishing work and the time that Lynne
    wakes up. While Lynne sleeping in a recliner is dictated by her inability to get
    into and out of her own bed, Wayne chooses to sleep in a recliner so he can be
    next to her. My goal is to make her last part of life as fright free, Wayne said.
    I never want her thinking she has to go alone. '
  :url: "https://photojournalism.s3.amazonaws.com/winners/2024/feature-picture-story/honorable-mention-cab4df/2024-feature-picture-story-honorable-mention-6-cab4df.jpg"
