  :credit: Joseph Scheller
  :caption: Nichole Newby, a home health aide, helps Lynne Roberts bathe while her
    husband, Wayne Roberts, watches on Friday, Feb. 2, 2024 inside their home. As
    Lynnes mobility continued to worsen, Wayne remodeled the house to make it more
    accommodating to Lynne which included remodeling the bathroom to install this
    walk-in bathtub. This also marked the first time the Roberts accepted any sort
    of in-home health care services, which reflected Lynnes need for medical assistance
    outside of Waynes capabilities.
