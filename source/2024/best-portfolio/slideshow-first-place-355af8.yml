  :credit: Luis Tato / Agence France-Presse
  :caption: "A Sudanese woman who has fled from the war in Sudan gets off a truck
    loaded with Sudanese families arriving at a Transit Centre for refugees in Renk,
    on February 14, 2024.\r\rMore than 550,000 people have now fled from the war in
    Sudan to South Sudan since the conflict exploded in April 2023, according to the
    United Nations. South Sudan, that has itself recently come out of decades of war,
    was facing a dire humanitarian situation before the war in Sudan erupted and it
    is feared to not have the resources to host displaced people. The war-torn country
    of Sudan is currently ravaged by internal fighting between the Sudanese Army and
    the paramilitary Rapid Support Forces (RSF)."
  :url: "https://photojournalism.s3.amazonaws.com/winners/2024/best-portfolio/first-place-355af8/2024-best-portfolio-first-place-29-355af8.jpg"
