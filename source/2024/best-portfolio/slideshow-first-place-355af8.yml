    Wildlife Service (KWS) try to take a sedated rhino out of the water for safety
    during a capture and translocation operation of rhinos in Nairobi National Park
    on January 16, 2024.\rPlans to translocate 21 rhinos to Loisaba Conservancy in
    Northern Kenya officially started on January 16, 2024. The animals will be moved
    from various congested conservancies to control population and poaching, but the
