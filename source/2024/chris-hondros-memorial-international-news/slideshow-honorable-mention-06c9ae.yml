- :title: Honorable Mention - 2024 Chris Hondros Memorial International News
  :credit: Luis Tato / Agence France-Presse
  :caption: "A girl looks on next to a damaged car buried in mud in an area heavily
    affected by torrential rains and flash floods in the village of Kamuchiri, near
    Mai Mahiu, on April 29, 2024.\r\rIntense floods in East Africa in 2024 displaced
    thousands, destroyed infrastructure, and left communities struggling to access
    essential resources. Kenya faced one of its worst floods in recent history, the
    latest in a string of weather catastrophes, following weeks of extreme rainfall
    linked to a changing climate. More than 300 people were killed and more than 55,000
    households displaced as murky waters submerge entire villages, destroyed roads
    and inundated dams."
