- :title: Third Place - 2024 Chris Hondros Memorial International News
  :credit: Luis Tato / Agence France-Presse
  :caption: "Protesters chant anti-government slogans as some of them climb a Kenya
    Police water cannon truck while demonstrating during a nationwide strike to protest
    against tax hikes and the Finance Bill 2024 in downtown Nairobi, on June 25, 2024.\r\rIn
    2024, weeks of protests in Kenya over a new finance bill that raised taxes led
    to at least 60 deaths, over 400 injuries and reports of abductions. Tensions peaked
    on June 25 when protesters stormed Parliament, demanding the bill's rejection.
    Violent clashes with police resulted in injuries and fires around Parliament,
    with opposition lawmakers joining demonstrators in calls for government accountability
    and police reform."
